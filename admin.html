<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AM Connect — Admin</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0e2338;color:#e8eef5;margin:0;padding:24px}
  h1{font-size:20px}
  .toolbar{display:flex;align-items:center;gap:10px;margin-top:10px}
  select{background:#20456e;color:#e8eef5;border:1px solid #2f5580;border-radius:6px;padding:6px 10px;font-size:13px}
  table{width:100%;border-collapse:collapse;margin-top:16px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #2f5580;font-size:14px}
  th{color:#9db4cc;text-transform:uppercase;font-size:11px;letter-spacing:.04em}
  tr.data-row:hover{background:#1a3a5e;cursor:pointer}
  #detail{margin-top:20px;background:#1a3a5e;border:1px solid #2f5580;border-radius:10px;padding:16px;display:none;white-space:pre-wrap;font-size:13px}
  .empty{color:#9db4cc;margin-top:20px}
  .badge{display:inline-block;padding:2px 8px;border-radius:12px;background:#20456e;font-size:11px;color:#9db4cc}
</style>
</head>
<body>
<h1>AM Connect — Submitted Forms</h1>
<div class="toolbar">
  <label for="formFilter" style="font-size:13px;color:#9db4cc">Form:</label>
  <select id="formFilter"><option value="">All forms</option></select>
</div>
<table id="tbl"><thead><tr><th>Form</th><th>Summary</th><th>Technician</th><th>Received</th></tr></thead><tbody></tbody></table>
<div class="empty" id="empty" style="display:none">No submissions yet.</div>
<pre id="detail"></pre>
<script>
let allRows = [];

function summaryFor(r) {
  return r.projectName || r.title || r.site || '(untitled)';
}
function techFor(r) {
  return r.techName || r.technician || '';
}

function populateFilter(rows) {
  const forms = [...new Set(rows.map(r => r.formTitle || r.formId).filter(Boolean))];
  const sel = document.getElementById('formFilter');
  forms.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f; opt.textContent = f;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => renderTable(sel.value));
}

function renderTable(filter) {
  const rows = filter ? allRows.filter(r => (r.formTitle || r.formId) === filter) : allRows;
  const tbody = document.querySelector('#tbl tbody');
  const empty = document.getElementById('empty');
  if (rows.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  tbody.innerHTML = rows.map(r => `
    <tr class="data-row" data-id="${r.id}">
      <td><span class="badge">${r.formTitle || r.formId || '—'}</span></td>
      <td>${summaryFor(r)}</td>
      <td>${techFor(r)}</td>
      <td>${new Date(r.receivedAt).toLocaleString()}</td>
    </tr>
  `).join('');
  tbody.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', async () => {
      const res = await fetch('/api/submissions/' + tr.dataset.id);
      const data = await res.json();
      const detail = document.getElementById('detail');
      detail.style.display = 'block';
      const { signature, ...rest } = data;
      detail.textContent = JSON.stringify(rest, null, 2);
    });
  });
}

async function load() {
  const res = await fetch('/api/submissions');
  allRows = await res.json();
  populateFilter(allRows);
  renderTable('');
}
load();
</script>
</body>
</html>
