<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AM Connect</title>
<meta name="theme-color" content="#0055a5">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AM Connect">
<style>
  :root{
    --bg:#0e2338; --panel:#1a3a5e; --panel2:#20456e; --border:#2f5580;
    --text:#e8eef5; --muted:#9db4cc; --accent:#4f8fd6; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--border);padding:calc(14px + env(safe-area-inset-top)) 16px 14px;z-index:10;display:flex;align-items:center;gap:10px}
  header h1{font-size:17px;margin:0;flex:1}
  #backBtn{background:none;border:none;color:var(--text);font-size:22px;padding:8px;margin:-8px;display:none;line-height:1;border-radius:8px}
  #backBtn:active{background:rgba(255,255,255,.1)}
  #backBtn.show{display:block}
  #status{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600}
  .status-online{background:rgba(34,197,94,.15);color:var(--ok)}
  .status-offline{background:rgba(245,158,11,.15);color:var(--warn)}
  main{max-width:640px;margin:0 auto;padding:16px}
  .section{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
  .section h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 12px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:15px
  }
  textarea{min-height:70px;resize:vertical}
  .row{display:flex;gap:10px}
  .row > *{flex:1}
  .check-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
  .check-row:last-child{border-bottom:none}
  .check-row span{font-size:14px}
  .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{flex:1;padding:6px 10px;background:var(--panel2);color:var(--muted);border:none;font-size:12px;font-weight:600}
  .seg button[data-val="pass"].active{background:var(--ok);color:#fff}
  .seg button[data-val="fail"].active{background:var(--err);color:#fff}
  .seg button[data-val="na"].active{background:#64748b;color:#fff}

  /* Progress card */
  .progress-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .progress-pct{font-size:26px;font-weight:800;color:#fff}
  .progress-sub{font-size:12px;color:var(--muted)}
  .progress-bar-track{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
  .progress-bar-fill{height:100%;background:var(--ok);border-radius:4px;width:0%;transition:width .2s}
  .sig-pad{width:100%;height:140px;background:#fff;border-radius:8px;touch-action:none}
  .sig-actions{display:flex;justify-content:flex-end;margin-top:6px}
  .sig-actions button{background:none;border:none;color:var(--accent);font-size:12px}

  .photo-field{margin-top:4px}
  .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .photo-grid:empty{display:none;margin:0}
  .photo-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--panel2)}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .photo-remove{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:none;font-size:14px;line-height:1;cursor:pointer}
  .photo-add-btn{width:100%;padding:10px;border-radius:8px;border:1px dashed var(--border);background:var(--panel2);color:var(--text);font-size:13px;font-weight:600}
  footer{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;gap:10px}
  footer.show{display:flex}
  .btn{flex:1;padding:14px;border-radius:10px;border:none;font-size:15px;font-weight:700}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
  #queuePanel{max-width:640px;margin:0 auto 16px;padding:0 16px}
  .q-item{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px}
  .q-badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600}
  .q-pending{background:rgba(245,158,11,.15);color:var(--warn)}
  .q-synced{background:rgba(34,197,94,.15);color:var(--ok)}
  .toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:10px 18px;border-radius:8px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}

  /* Home screen */
  .form-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;cursor:pointer}
  .form-card:active{background:var(--panel2)}
  .form-card .icon{width:44px;height:44px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .form-card .info{flex:1;min-width:0}
  .form-card .info h3{margin:0 0 4px;font-size:15px}
  .form-card .info p{margin:0;font-size:12px;color:var(--muted)}
  .form-card .chev{color:var(--muted);font-size:18px}
  .home-heading{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:6px 0 10px}
</style>
</head>
<body>
<header>
  <button id="backBtn" aria-label="Back">&larr;</button>
  <h1 id="headerTitle">AM Connect</h1>
  <span id="status" class="status-online">Online</span>
</header>

<div id="toast" class="toast"></div>

<div id="queuePanel"></div>

<main>
  <div id="homeView">
    <div class="home-heading">Forms</div>
    <div id="formList"></div>
  </div>

  <div id="formView" style="display:none">
    <div id="progressCard" class="progress-card">
      <div class="progress-top">
        <div class="progress-pct" id="progressPct">0%</div>
        <div class="progress-sub" id="progressSub">0 of 0 checks</div>
      </div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
    </div>
    <form id="activeForm"></form>
  </div>
</main>

<footer id="formFooter">
  <button class="btn btn-secondary" type="button" id="saveDraftBtn">Save Draft</button>
  <button class="btn btn-primary" type="button" id="submitBtn">Submit</button>
</footer>

<script src="/vendor/jspdf.umd.min.js"></script>
<script src="/forms.js"></script>
<script src="/logo.js"></script>
<script src="/pdf.js"></script>
<script src="/app.js"></script>
</body>
</html>
